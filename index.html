<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Regi Al Habib · Fullstack Developer</title>
    <meta name="description" content="Portofolio Regi Al Habib, fullstack developer yang membangun aplikasi web dengan Laravel dan React yang cepat, rapi, dan enak dipakai." />
    <meta property="og:title" content="Regi Al Habib · Fullstack Developer" />
    <meta property="og:description" content="Portofolio Regi Al Habib, fullstack developer yang membangun aplikasi web dengan Laravel dan React yang cepat, rapi, dan enak dipakai." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#F6F5FB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131120" media="(prefers-color-scheme: dark)" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" />

    <!-- Pasang tema sebelum render supaya tidak berkedip -->
    <script>
      try {
        const saved = localStorage.getItem('theme')
        const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('dark')
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
